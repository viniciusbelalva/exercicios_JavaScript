<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - 09 - JS</title>
    <script>
    var notas = prompt('Qual foi sua nota? (A/B/C/D/E/F) ');

    switch (notas){
        case 'A':
        document.write( ' Excelente! ' )
        break
         case 'B':
        document.write( ' Ótimo! ' )
        break
         case 'C':
        document.write( 'Bom ' )
        break
         case 'D':
        document.write( ' Regular ' )
        break
         case 'E':
        document.write( ' Ruim ' )
        break
         case 'F':
        document.write( ' Nos vemos no ano que vem... ' )
        break
        default:
            document.write('Valor não registrado')
    }



    </script>
</head>
<body>
    
</body>
</html>
