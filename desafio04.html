    <script>
        var usuario = prompt('Qual seu usuário?');
        var classe = prompt('Qual classe você se encontra? (1/2/3)');
        var venda = Number(prompt('Quantos reais você vendeu?'));

        if (classe == '1'){
            total = 0.025 * venda + 1500
        }
        else if (classe == '2'){
            total = 2000 + 0.03 * venda
        }
        else if (classe == '3'){
            total = 2500 + 0.035 * venda
        }
        document.write ('Você irá receber ' + total + ' reais');
    </script>
