<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Condicional - IF else</title>

    <script>

        var nota = prompt('Digite sua nota');
        var frequencia = prompt('Digite sua frequencia');
        var media = 7;
        var freq = 75;

            if(nota >= media && frequencia >= freq){
                document.write ('APROVADO');
            } else{
                document.write ('REPROVADO');
            }
</script>

</head>
<body>
    
</body>
</html>
