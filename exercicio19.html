<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 19 - Manipulação de DOM</title>
    <script>

    </script>
</head>
<body>
<input type="text" id="n1" >
<input type="text" id="n2">
<input type="text" id="n3" disabled="disabled">
<br>
<button onclick="calcular()">Calc</button>

<script>
    function calcular(){
        var num1 = Number(document.getElementById('n1').value);
        var num2 = Number(document.getElementById('n2').value);
        var num3 = num1 + num2;
        document.getElementById('n3').value = num3;
    }
</script>

</body>
</html>
