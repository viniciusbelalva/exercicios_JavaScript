<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        var nome = prompt('Qual seu nome?');
        var salario = parseInt(prompt('Qual seu salário?'));
        var venda = parseInt(prompt('Qual sua venda desse mês?'));
        var comissao = 0;
    </script>
</head>
<body>  
    <script>
        
        
        comissao = venda * 0.025;
        salario = salario + comissao;

        document.write('Olá ' + nome + ' seu salário será de ' + salario + ' <br/>');
    </script>
</body>
</html>
