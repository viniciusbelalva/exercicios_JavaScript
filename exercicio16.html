<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio16</title>
    <script>
        var numero1= Number(prompt("Digite o primeiro número:"));
        var numero2= Number(prompt("Digite o segundo número:"));

        function calcularDiferenca(numero1, numero2){
            var diferenca= numero1-numero2;
            return diferenca;
        }
        var resultado= calcularDiferenca(numero1, numero2);
        document.write("A diferença entre os números é: " + resultado);
    </script>
</head>
