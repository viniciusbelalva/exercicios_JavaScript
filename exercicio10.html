<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício - 09 - JS</title>
    <script>
    var notas = prompt('Me diga a quantidade de dias do mês que precisa? (28/29/30/31)');

    switch (notas){
        case '28':
        document.write( ' 02 ' )
        break
        case '29':
        document.write( ' 02 apenas em anos bissextos ' )
        break
         case '30':
        document.write( ' 04/06/09/11 ' )
        break
         case '31':
        document.write( ' 01/03/05/07/08/10/12 ' )
        break
        default:
            document.write('Mês não encontrado')
    }



    </script>
</head>
<body>
    
</body>
</html>
