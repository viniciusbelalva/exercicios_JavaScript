<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>

        function verificarParImpar(x){

        
        if ((x % 2) === 0){
            document.write('PAR </br>');
        }
        else{
            document.write('IMPAR </br>');
        }
    }

    verificarParImpar(Number(prompt('Informe o valor: ')));

    </script>
</head>
